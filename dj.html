<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids DJ Remix Station</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#ff9800,#ff5722,#ffb300);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
color:white;
}

h1{
font-size:clamp(2rem,4vw,4rem);
text-shadow:0 3px 10px rgba(0,0,0,.3);
margin-bottom:10px;
}

#visualizer{
width:90%;
height:220px;
background:rgba(255,255,255,.15);
border-radius:25px;
backdrop-filter:blur(10px);
}

.controls{
width:95%;
max-width:1200px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
margin-top:15px;
}

button,label{
border:none;
border-radius:20px;
padding:20px;
font-size:1.2rem;
font-weight:bold;
cursor:pointer;
text-align:center;
background:white;
color:#ff5722;
transition:.2s;
}

button:hover,label:hover{
transform:scale(1.05);
}

.djwheel{
width:260px;
height:260px;
border-radius:50%;
background:
radial-gradient(circle,#333 0,#111 40%,#000 100%);
border:12px solid white;
margin:15px;
position:relative;
animation:spin 8s linear infinite;
}

.djwheel::after{
content:'';
position:absolute;
width:40px;
height:40px;
background:#ff9800;
border-radius:50%;
left:50%;
top:50%;
transform:translate(-50%,-50%);
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

input[type=file]{
display:none;
}

.active{
background:#00e676;
color:black;
}

#status{
font-size:1.2rem;
margin-bottom:10px;
}
</style>
</head>
<body>

<h1>🎵 KIDS DJ REMIX STATION 🎵</h1>

<div id="status">Load a music file to start</div>

<canvas id="visualizer"></canvas>

<div class="djwheel"></div>

<div class="controls">

<label for="fileInput">
LOAD SONG
</label>

<input id="fileInput" type="file" accept="audio/*">

<button id="playBtn">PLAY</button>
<button id="bassBtn">BASS BOOST</button>
<button id="echoBtn">ECHO</button>
<button id="robotBtn">ROBOT</button>
<button id="chipBtn">CHIPMUNK</button>
<button id="slowBtn">SLOW</button>
<button id="fastBtn">FAST</button>
<button id="randomBtn">RANDOM MIX</button>
<button id="fullscreenBtn">FULLSCREEN</button>

</div>

<audio id="audio"></audio>

<script>
const audio=document.getElementById('audio');
const fileInput=document.getElementById('fileInput');
const playBtn=document.getElementById('playBtn');
const status=document.getElementById('status');

let audioCtx;
let source;
let analyser;
let bassFilter;
let delayNode;
let robotFilter;

function setupAudio(){

audioCtx=new(window.AudioContext||window.webkitAudioContext)();

source=audioCtx.createMediaElementSource(audio);

analyser=audioCtx.createAnalyser();
analyser.fftSize=256;

bassFilter=audioCtx.createBiquadFilter();
bassFilter.type="lowshelf";
bassFilter.frequency.value=200;
bassFilter.gain.value=0;

robotFilter=audioCtx.createBiquadFilter();
robotFilter.type="bandpass";
robotFilter.frequency.value=1000;

delayNode=audioCtx.createDelay();
delayNode.delayTime.value=0;

source.connect(bassFilter);
bassFilter.connect(delayNode);
delayNode.connect(analyser);
analyser.connect(audioCtx.destination);

drawVisualizer();
}

fileInput.addEventListener('change',e=>{

const file=e.target.files[0];
if(!file) return;

audio.src=URL.createObjectURL(file);
status.textContent="Loaded: "+file.name;

if(!audioCtx){
setupAudio();
}
});

playBtn.onclick=()=>{
if(audio.paused){
audio.play();
playBtn.textContent="PAUSE";
}else{
audio.pause();
playBtn.textContent="PLAY";
}
};

document.getElementById("bassBtn").onclick=function(){
if(bassFilter.gain.value===0){
bassFilter.gain.value=20;
this.classList.add("active");
}else{
bassFilter.gain.value=0;
this.classList.remove("active");
}
};

document.getElementById("echoBtn").onclick=function(){
if(delayNode.delayTime.value===0){
delayNode.delayTime.value=.3;
this.classList.add("active");
}else{
delayNode.delayTime.value=0;
this.classList.remove("active");
}
};

document.getElementById("robotBtn").onclick=function(){

if(this.classList.contains("active")){

source.disconnect();

source.connect(bassFilter);
bassFilter.connect(delayNode);
delayNode.connect(analyser);

this.classList.remove("active");

}else{

source.disconnect();

source.connect(robotFilter);
robotFilter.connect(delayNode);
delayNode.connect(analyser);

this.classList.add("active");
}
};

document.getElementById("chipBtn").onclick=function(){

audio.playbackRate=1.5;
this.classList.add("active");
};

document.getElementById("slowBtn").onclick=function(){
audio.playbackRate=.75;
};

document.getElementById("fastBtn").onclick=function(){
audio.playbackRate=1.25;
};

document.getElementById("randomBtn").onclick=function(){

bassFilter.gain.value=Math.random()*30;

delayNode.delayTime.value=Math.random()*0.5;

audio.playbackRate=
0.75+Math.random()*1.0;

document.body.style.filter=
`hue-rotate(${Math.random()*360}deg)`;
};

document.getElementById("fullscreenBtn").onclick=()=>{

if(!document.fullscreenElement){
document.documentElement.requestFullscreen();
}else{
document.exitFullscreen();
}
};

function drawVisualizer(){

const canvas=document.getElementById('visualizer');
const ctx=canvas.getContext('2d');

function resize(){
canvas.width=canvas.clientWidth;
canvas.height=canvas.clientHeight;
}
resize();
window.addEventListener('resize',resize);

const bufferLength=analyser.frequencyBinCount;
const dataArray=new Uint8Array(bufferLength);

function draw(){

requestAnimationFrame(draw);

analyser.getByteFrequencyData(dataArray);

ctx.clearRect(0,0,canvas.width,canvas.height);

const barWidth=(canvas.width/bufferLength)*2;

let x=0;

for(let i=0;i<bufferLength;i++){

let h=dataArray[i];

ctx.fillStyle=`hsl(${i*5},100%,50%)`;

ctx.fillRect(
x,
canvas.height-h,
barWidth,
h
);

x+=barWidth+1;
}
}

draw();
}
</script>

</body>
</html>
