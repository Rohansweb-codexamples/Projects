<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Scoreboard Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --bg: #02040a;
      --accent: #00e0ff;
      --accent2: #ffdd00;
      --text: #ffffff;
      --font-main: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: var(--font-main);
      background: radial-gradient(circle at top, #101633 0, #02040a 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .wrapper {
      width: 100%;
      max-width: 1400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header-title {
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .header-clock {
      font-size: 1rem;
      font-weight: 600;
    }

    .scoreboard {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .team-card {
      position: relative;
      border-radius: 24px;
      padding: 24px;
      background: radial-gradient(circle at top left, rgba(0, 224, 255, 0.25), rgba(0, 0, 0, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .team-name {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(0, 0, 0, 0.9);
    }

    .team-score {
      font-size: 5rem;
      font-weight: 800;
      text-align: right;
      line-height: 1;
      color: var(--accent2);
      text-shadow: 0 0 30px rgba(255, 221, 0, 0.7);
    }

    .glow-bar {
      position: absolute;
      inset: auto 0 0 0;
      height: 6px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      opacity: 0.9;
    }

    .footer {
      text-align: center;
      font-size: 0.85rem;
      opacity: 0.7;
    }

    @media (max-width: 900px) {
      .scoreboard {
        grid-template-columns: 1fr;
      }
      .team-name {
        font-size: 1.8rem;
      }
      .team-score {
        font-size: 3.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="header-title">LIVE SCOREBOARD</div>
      <div class="header-clock" id="clock"></div>
    </header>

    <main class="scoreboard" id="scoreboard"></main>

    <footer class="footer">
      Viewer is synced with admin via localStorage. Press <strong>F11</strong> for full-screen.
    </footer>
  </div>

  <script>
    const STORAGE_KEY = "scoreboard_teams_v1";

    function loadTeams() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      try {
        return JSON.parse(raw);
      } catch {
        return [];
      }
    }

    function renderScoreboard() {
      const teams = loadTeams();
      const container = document.getElementById("scoreboard");
      container.innerHTML = "";

      if (teams.length === 0) {
        container.innerHTML =
          '<p style="text-align:center;opacity:0.7;font-size:1rem;">No teams configured. Open admin to add teams.</p>';
        return;
      }

      teams.forEach((team) => {
        const card = document.createElement("div");
        card.className = "team-card";

        const name = document.createElement("div");
        name.className = "team-name";
        name.textContent = team.name;

        const score = document.createElement("div");
        score.className = "team-score";
        score.textContent = team.score;

        const glow = document.createElement("div");
        glow.className = "glow-bar";

        card.append(name, score, glow);
        container.appendChild(card);
      });
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, "0");
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");
      document.getElementById("clock").textContent = `${h}:${m}:${s}`;
    }

    // Initial render
    renderScoreboard();
    updateClock();

    // Refresh scoreboard periodically (simple polling)
    setInterval(renderScoreboard, 1000);
    setInterval(updateClock, 1000);

    // Also listen for storage changes (if same browser)
    window.addEventListener("storage", (event) => {
      if (event.key === STORAGE_KEY) {
        renderScoreboard();
      }
    });
  </script>
</body>
</html>
