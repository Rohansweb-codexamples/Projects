<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Your Experience</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9500,#ff6a00,#ff3d00);
    overflow-x:hidden;
}

.container{
    width:100%;
    max-width:1200px;
    text-align:center;
    padding:40px 20px;
}

h1{
    color:white;
    font-size:clamp(3rem,8vw,6rem);
    margin-bottom:15px;
}

.subtitle{
    color:white;
    font-size:clamp(1.2rem,3vw,2rem);
    margin-bottom:40px;
}

.stars{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-bottom:30px;
}

.star{
    font-size:clamp(3rem,8vw,7rem);
    color:rgba(255,255,255,.3);
    cursor:pointer;
    transition:.2s;
    user-select:none;
}

.star:hover{
    transform:scale(1.15);
}

.star.active{
    color:#ffd700;
    text-shadow:0 0 25px #ffd700;
}

.ratingText{
    color:white;
    font-size:clamp(1.8rem,4vw,3rem);
    font-weight:bold;
    min-height:60px;
    margin-bottom:25px;
}

textarea{
    width:min(800px,95%);
    height:160px;
    border:none;
    border-radius:20px;
    padding:20px;
    font-size:18px;
    resize:vertical;
    outline:none;
    margin-bottom:25px;
}

.submit{
    background:white;
    color:#ff6a00;
    border:none;
    border-radius:999px;
    padding:20px 60px;
    font-size:1.5rem;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.submit:hover{
    transform:scale(1.08);
}

.confetti{
    position:fixed;
    width:12px;
    height:12px;
    pointer-events:none;
    animation:fall linear forwards;
}

@keyframes fall{
    from{
        transform:translateY(-20px) rotate(0deg);
        opacity:1;
    }
    to{
        transform:translateY(110vh) rotate(720deg);
        opacity:0;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>Rate Your Experience</h1>

<div class="subtitle">
Please rate us from 1 to 10 stars
</div>

<form
action="https://formsubmit.co/rohanwest20@gmail.com"
method="POST"
onsubmit="return submitRating()"
>

<input type="hidden" name="_subject" value="New Rating Received">
<input type="hidden" name="_captcha" value="false">
<input type="hidden" name="_template" value="table">

<input type="hidden" name="Rating" id="ratingInput">

<div class="stars" id="stars"></div>

<div class="ratingText" id="ratingText">
Choose a rating
</div>

<textarea
name="Why"
placeholder="Why did you give this rating? (Optional)"
></textarea>

<br>

<button class="submit" type="submit">
Submit Rating
</button>

</form>

</div>

<script>
let selectedRating = 0;

const starsContainer = document.getElementById("stars");

for(let i=1;i<=10;i++){

    const star = document.createElement("span");

    star.className = "star";
    star.innerHTML = "★";

    star.onclick = () => {

        selectedRating = i;

        document.querySelectorAll(".star")
        .forEach((s,index)=>{

            if(index < i){
                s.classList.add("active");
            }else{
                s.classList.remove("active");
            }

        });

        document.getElementById("ratingText")
        .textContent = i + " / 10 Stars";
    };

    starsContainer.appendChild(star);
}

function submitRating(){

    if(selectedRating === 0){
        alert("Please select a rating.");
        return false;
    }

    document.getElementById("ratingInput").value =
    selectedRating + " / 10 Stars";

    createConfetti();

    return true;
}

function createConfetti(){

    for(let i=0;i<150;i++){

        const c = document.createElement("div");

        c.className = "confetti";

        c.style.left = Math.random()*100 + "vw";

        c.style.background =
        `hsl(${Math.random()*360},100%,50%)`;

        c.style.animationDuration =
        (Math.random()*3+2) + "s";

        document.body.appendChild(c);

        setTimeout(()=>{
            c.remove();
        },5000);
    }
}
</script>

</body>
</html>
