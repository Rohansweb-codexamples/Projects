<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Sunflower Scoreboard Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
/* 🌻 GLOBAL THEME */
:root {
  --bg: #fff9e6;
  --panel-bg: #fff3c4;
  --accent: #ffcc33;
  --accent-dark: #e6a800;
  --text: #5a4a00;
  --danger: #d9534f;
  --font-main: "Segoe UI", system-ui, sans-serif;
}

body {
  margin: 0;
  font-family: var(--font-main);
  background: url('https://i.imgur.com/8vQeYtW.jpeg');
  background-size: cover;
  background-attachment: fixed;
  color: var(--text);
}

/* Hide admin/viewer depending on mode */
#adminPanel, #viewerPanel { display: none; }

/* 🌻 ADMIN PANEL */
.layout {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 24px;
  padding: 24px;
}

.panel {
  background: var(--panel-bg);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  border: 2px solid var(--accent);
}

.panel h2 {
  margin: 0 0 16px;
  font-size: 1.4rem;
  color: var(--accent-dark);
  text-shadow: 0 1px 0 #fff;
}

.teams-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-height: 60vh;
  overflow-y: auto;
}

.team-row {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 1fr auto;
  gap: 8px;
  padding: 12px;
  border-radius: 14px;
  background: #fffbe2;
  border: 1px solid #ffe58a;
}

.team-name { font-weight: 600; }

.score-display {
  font-size: 1.2rem;
  text-align: center;
  padding: 6px 10px;
  border-radius: 10px;
  background: #fff4c2;
  border: 1px solid #ffe58a;
}

button {
  border: none;
  border-radius: 10px;
  padding: 6px 12px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
}

.btn-accent { background: var(--accent); color: #5a4a00; }
.btn-outline { background: #fff; border: 2px solid var(--accent); color: var(--accent-dark); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-small { padding: 4px 10px; font-size: 0.8rem; }

/* 🌻 VIEWER PANEL */
#viewerPanel {
  padding: 24px;
  text-align: center;
}

.scoreboard {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 20px;
  margin-top: 20px;
}

.team-card {
  border-radius: 24px;
  padding: 24px;
  background: #fffbe2;
  border: 3px solid var(--accent);
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  transition: transform 0.2s ease;
}

.team-card.pop {
  transform: scale(1.05);
}

.team-name-view {
  font-size: 2.4rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--accent-dark);
}

.team-score-view {
  font-size: 5rem;
  font-weight: 800;
  color: var(--accent-dark);
  margin-top: 10px;
}

/* Colour picker */
.color-input {
  width: 40px;
  height: 30px;
  border-radius: 6px;
  border: 2px solid var(--accent-dark);
}
</style>
</head>
<body>

<!-- 🌻 ADMIN MODE -->
<div id="adminPanel">
  <div class="layout">
    <section class="panel">
      <h2>Teams & Scores</h2>
      <div class="teams-list" id="teamsList"></div>

      <form id="newTeamForm">
        <input id="teamName" type="text" placeholder="Team name" required
               style="width:100%;padding:10px;border-radius:10px;margin-top:10px;">
        <label style="margin-top:10px;">Team Colour:</label>
        <input id="teamColor" type="color" class="color-input" value="#ffcc33">
        <button class="btn-accent" style="margin-top:10px;width:100%;">Add Team</button>
      </form>
    </section>

    <section class="panel">
      <h2>Display / Viewer</h2>

      <label>Custom Points:</label>
      <input id="customPoints" type="number" value="3"
             style="width:100%;padding:10px;border-radius:10px;margin-bottom:10px;">

      <button class="btn-outline" onclick="openViewer()">Open Viewer</button>
      <button class="btn-danger btn-small" onclick="resetAll()" style="margin-top:10px;">Reset All</button>
    </section>
  </div>
</div>

<!-- 🌻 VIEWER MODE -->
<div id="viewerPanel">
  <h1 style="font-size:3rem;color:#e6a800;text-shadow:0 2px 0 #fff;">🌻 LIVE SUNFLOWER SCOREBOARD 🌻</h1>
  <div class="scoreboard" id="viewerBoard"></div>
</div>

<script>
/* STORAGE */
const KEY = "sunflower_scoreboard_v1";

/* MODE HANDLING */
const params = new URLSearchParams(location.search);
const mode = params.get("mode") || "admin";
document.getElementById(mode === "viewer" ? "viewerPanel" : "adminPanel").style.display = "block";

/* TEAM STORAGE */
function loadTeams() {
  return JSON.parse(localStorage.getItem(KEY) || "[]");
}
function saveTeams(t) {
  localStorage.setItem(KEY, JSON.stringify(t));
  renderAdmin();
  renderViewer();
}

/* ADMIN RENDER */
function renderAdmin() {
  const list = document.getElementById("teamsList");
  if (!list) return;
  const teams = loadTeams();
  list.innerHTML = "";

  teams.forEach((t,i)=>{
    list.innerHTML += `
      <div class="team-row" style="border-left:10px solid ${t.color}">
        <div class="team-name">${t.name}</div>
        <div class="score-display">${t.score}</div>
        <div>
          <button class="btn-outline btn-small" onclick="changeScore(${i},-1)">-1</button>
          <button class="btn-accent btn-small" onclick="changeScore(${i},1)">+1</button>
          <button class="btn-accent btn-small" onclick="changeScore(${i},5)">+5</button>
          <button class="btn-accent btn-small" onclick="changeScore(${i},parseInt(document.getElementById('customPoints').value))">
            +${document.getElementById('customPoints').value}
          </button>
        </div>
        <button class="btn-danger btn-small" onclick="deleteTeam(${i})">✕</button>
      </div>
    `;
  });
}

/* VIEWER RENDER */
function renderViewer() {
  const board = document.getElementById("viewerBoard");
  if (!board) return;
  const teams = loadTeams();
  board.innerHTML = "";

  teams.forEach((t,i)=>{
    board.innerHTML += `
      <div class="team-card" id="teamCard${i}" style="border-color:${t.color};background:${t.color}33;">
        <div class="team-name-view">${t.name}</div>
        <div class="team-score-view">${t.score}</div>
      </div>
    `;
  });
}

/* SCORE FUNCTIONS */
function changeScore(i,delta){
  const t = loadTeams();
  t[i].score = Math.max(0, t[i].score + delta);
  saveTeams(t);

  // POP ANIMATION
  const card = document.getElementById("teamCard"+i);
  if (card) {
    card.classList.add("pop");
    setTimeout(()=>card.classList.remove("pop"),200);
  }
}

function deleteTeam(i){
  const t = loadTeams();
  t.splice(i,1);
  saveTeams(t);
}

function resetAll(){
  if(confirm("Reset all teams?")){
    localStorage.removeItem(KEY);
    renderAdmin();
    renderViewer();
  }
}

/* ADD TEAM */
const form = document.getElementById("newTeamForm");
if (form) {
  form.addEventListener("submit", e=>{
    e.preventDefault();
    const name = document.getElementById("teamName").value.trim();
    const color = document.getElementById("teamColor").value;
    if (!name) return;
    const t = loadTeams();
    t.push({name,score:0,color});
    saveTeams(t);
    form.reset();
  });
}

/* AUTO-OPEN VIEWER ON SECOND SCREEN */
function openViewer() {
  let viewer = window.open(
    location.pathname + "?mode=viewer",
    "viewerWindow",
    "popup=yes,width=800,height=600"
  );

  setTimeout(()=>{
    try {
      if (window.screen.availWidth < window.screen.width * 1.5) {
        viewer.moveTo(0,0);
        viewer.resizeTo(screen.availWidth, screen.availHeight);
      } else {
        viewer.moveTo(screen.width + 10, 0);
        viewer.resizeTo(screen.availWidth, screen.availHeight);
      }
      viewer.focus();
    } catch(e){}
  }, 300);
}

/* INITIAL RENDER */
renderAdmin();
renderViewer();

/* LIVE SYNC */
window.addEventListener("storage", renderViewer);
</script>

</body>
</html>
