<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rohans Web TV Controller</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd54f,#ff9800,#ff5722);
min-height:100vh;
padding:20px;
color:#111;
}

.panel{
max-width:1100px;
margin:auto;
background:white;
border-radius:25px;
padding:20px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

h1{
margin-top:0;
}

.controls{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;
margin-bottom:20px;
}

button{
border:none;
padding:14px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
background:#111;
color:white;
}

button:hover{
transform:translateY(-2px);
}

input[type=file]{
width:100%;
padding:12px;
border:2px dashed #ff9800;
border-radius:14px;
}

.previewArea{
display:grid;
grid-template-columns:1fr 320px;
gap:20px;
margin-top:20px;
}

@media(max-width:900px){
.previewArea{
grid-template-columns:1fr;
}
}

.preview{
background:black;
border-radius:20px;
height:550px;
position:relative;
overflow:hidden;
}

#bg{
position:absolute;
inset:-20%;
background:
radial-gradient(circle,#ffd54f,#ff9800,#ff5722,#000);
filter:blur(40px);
transition:.1s;
}

#picture{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
max-width:85%;
max-height:85%;
border-radius:20px;
object-fit:contain;
box-shadow:0 0 40px rgba(255,255,255,.3);
}

#waveCanvas{
position:absolute;
inset:0;
width:100%;
height:100%;
}

.side{
background:#fafafa;
border-radius:20px;
padding:15px;
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input[type=range]{
width:100%;
}

.stat{
padding:10px;
background:#eee;
border-radius:10px;
margin-top:10px;
}
</style>
</head>
<body>

<div class="panel">

<h1>Rohans Web TV Controller</h1>

<div class="controls">

<button id="startMic">
Start Audio
</button>

<button id="sendImage">
Send Picture
</button>

<button id="fullscreenBtn">
Fullscreen Preview
</button>

</div>

<input
id="imageInput"
type="file"
accept="image/*">

<div class="previewArea">

<div class="preview">

<div id="bg"></div>

<canvas id="waveCanvas"></canvas>

<img id="picture">

</div>

<div class="side">

<h3>Status</h3>

<div class="stat" id="connectionStatus">
Connecting...
</div>

<div class="stat" id="audioStatus">
Audio Stopped
</div>

<label>
Background Strength
</label>

<input
id="strength"
type="range"
min="0"
max="5"
step="0.1"
value="1">

<label>
Wave Height
</label>

<input
id="waveHeight"
type="range"
min="1"
max="8"
step="0.1"
value="2">

<label>
Image Scale
</label>

<input
id="imageScale"
type="range"
min="0.5"
max="2"
step="0.1"
value="1">

</div>

</div>

</div>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

const imageInput =
document.getElementById(
"imageInput"
);

const picture =
document.getElementById(
"picture"
);

const bg =
document.getElementById(
"bg"
);

const canvas =
document.getElementById(
"waveCanvas"
);

const ctx =
canvas.getContext("2d");

let audioLevel = 0;

let analyser;
let dataArray;

function resizeCanvas(){

canvas.width =
canvas.clientWidth;

canvas.height =
canvas.clientHeight;

}

window.addEventListener(
"resize",
resizeCanvas
);

resizeCanvas();

socket.on(
"connect",
()=>{

document.getElementById(
"connectionStatus"
).textContent =
"Connected to Server";

}
);

imageInput.addEventListener(
"change",
e=>{

const file =
e.target.files[0];

if(!file) return;

const reader =
new FileReader();

reader.onload = ()=>{

picture.src =
reader.result;

socket.emit(
"controller-image",
{
image:
reader.result
}
);

};

reader.readAsDataURL(
file
);

}
);

document
.getElementById(
"sendImage"
)
.addEventListener(
"click",
()=>{

if(!picture.src) return;

socket.emit(
"controller-image",
{
image:
picture.src
}
);

}
);

document
.getElementById(
"startMic"
)
.addEventListener(
"click",
async()=>{

const stream =
await navigator
.mediaDevices
.getUserMedia({
audio:true
});

const context =
new AudioContext();

const source =
context
.createMediaStreamSource(
stream
);

analyser =
context
.createAnalyser();

analyser.fftSize = 256;

source.connect(
analyser
);

dataArray =
new Uint8Array(
analyser.frequencyBinCount
);

document
.getElementById(
"audioStatus"
)
.textContent =
"Audio Running";

animateAudio();

}
);

function animateAudio(){

requestAnimationFrame(
animateAudio
);

if(!analyser)
return;

analyser.getByteFrequencyData(
dataArray
);

let total = 0;

for(
let i=0;
i<dataArray.length;
i++
){
total += dataArray[i];
}

audioLevel =
total /
dataArray.length;

socket.emit(
"audio-level",
{
level:audioLevel
}
);

drawWave();

const strength =
Number(
document
.getElementById(
"strength"
)
.value
);

bg.style.transform =
`scale(${
1 +
(audioLevel/300)
* strength
})`;

}

function drawWave(){

const w =
canvas.width;

const h =
canvas.height;

ctx.clearRect(
0,
0,
w,
h
);

const waveStrength =
Number(
document
.getElementById(
"waveHeight"
)
.value
);

ctx.beginPath();

for(
let x=0;
x<w;
x+=5
){

const y =
h*0.85 +
Math.sin(
x*0.02 +
Date.now()*0.005
)
*
(audioLevel/10)
*
waveStrength;

if(x===0){

ctx.moveTo(
x,
y
);

}else{

ctx.lineTo(
x,
y
);

}

}

const gradient =
ctx.createLinearGradient(
0,
h,
0,
0
);

gradient.addColorStop(
0,
"#ff5722"
);

gradient.addColorStop(
1,
"#ffd54f"
);

ctx.strokeStyle =
gradient;

ctx.lineWidth = 4;

ctx.stroke();

}

document
.getElementById(
"imageScale"
)
.addEventListener(
"input",
e=>{

picture.style.transform =
`translate(-50%,-50%)
 scale(${e.target.value})`;

socket.emit(
"image-scale",
{
scale:
e.target.value
}
);

}
);

document
.getElementById(
"fullscreenBtn"
)
.addEventListener(
"click",
()=>{

document
.querySelector(
".preview"
)
.requestFullscreen();

}
);

</script>

</body>
</html>
