<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rohans Web Display Controller</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffb300,#ff6f00);
color:#111;
min-height:100vh;
padding:20px;
}

.card{
background:white;
border-radius:20px;
padding:20px;
max-width:800px;
margin:auto;
}

button{
padding:12px 18px;
border:none;
border-radius:12px;
background:#111;
color:white;
cursor:pointer;
}

input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ccc;
margin-top:8px;
}

#bars{
height:220px;
display:flex;
align-items:flex-end;
gap:3px;
margin-top:20px;
}

.bar{
flex:1;
background:#ff7a00;
border-radius:4px 4px 0 0;
}
</style>
</head>
<body>

<div class="card">

<h1>Rohans Web Display Controller</h1>

<button onclick="openViewer()">
Open Viewer
</button>

<br><br>

<label>Track Name</label>
<input id="trackName" value="My Music">

<br>

<label>Artwork URL</label>
<input id="artworkUrl" value="https://picsum.photos/500">

<br><br>

<button onclick="sendInfo()">
Send To Viewer
</button>

<div id="bars"></div>

</div>

<script>
const channel=new BroadcastChannel("rohans_display");

const barsContainer=document.getElementById("bars");

const bars=[];

for(let i=0;i<48;i++){
const div=document.createElement("div");
div.className="bar";
div.style.height="20px";
barsContainer.appendChild(div);
bars.push(div);
}

function openViewer(){
window.open("viewer.html","_blank");
}

function sendInfo(){
channel.postMessage({
type:"info",
title:document.getElementById("trackName").value,
artwork:document.getElementById("artworkUrl").value
});
}

setInterval(()=>{

const values=[];

bars.forEach(bar=>{

const value=20+Math.random()*180;

bar.style.height=value+"px";

values.push(value);

});

channel.postMessage({
type:"visualiser",
bars:values
});

},50);
</script>

</body>
</html>
