<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohans Web Bingo Cards</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#63318a,#160d27 72%);font-family:Arial,sans-serif;color:#fff}.wrap{max-width:760px;margin:auto}.top{text-align:center}.top small{color:#ffc15b;letter-spacing:3px;font-weight:900}.top h1{font-size:clamp(32px,7vw,54px);margin:8px}.panel{background:#241338;border:1px solid #ffffff28;border-radius:20px;padding:18px;box-shadow:0 18px 50px #0005}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}.row input,.row button{border:1px solid #ffffff35;border-radius:11px;padding:13px;background:#170d25;color:white;font-size:16px}.row input{flex:1;min-width:190px}.row button{background:linear-gradient(110deg,#ff7b1a,#ffd15b);color:#21102d;font-weight:900;cursor:pointer}.row button:disabled{opacity:.4;cursor:not-allowed}.round{text-align:center;color:#ffcf6a;font-weight:900;font-size:18px;margin:8px}.number{text-align:center;color:#fff;font-size:14px;margin:6px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.head,.cell{display:grid;place-items:center;border-radius:10px;min-height:60px;font-weight:1000}.head{background:#ff922e;color:#24102e;font-size:clamp(19px,4vw,28px)}.cell{width:100%;border:1px solid #ffffff20;background:#38204f;color:white;font-size:clamp(18px,4vw,27px);cursor:pointer}.cell.mark{background:#ffb638;color:#21102d;box-shadow:0 0 18px #ffb63888}.cell.free{background:#673a85;color:white;font-size:12px;cursor:default}.status{text-align:center;color:#ffe2a0;min-height:26px;margin:14px 0;font-weight:bold}.claim{width:100%;font-size:20px!important;padding:17px!important}.called{text-align:center;font-size:13px;color:#d7c5e9;line-height:1.8;margin-top:15px}.called strong{color:#ffcb68}.winner{display:none;text-align:center;margin-top:12px;padding:15px;border-radius:12px;background:#51216e;color:#ffdf7b;font-weight:900;font-size:20px}.winner.show{display:block}@media(max-width:480px){body{padding:9px}.panel{padding:10px}.grid{gap:4px}.head,.cell{min-height:52px;border-radius:7px}}
</style></head><body><div class="wrap"><div class="top"><small>ROHANS WEB • PLAYER CARD</small><h1>Virtual Bingo</h1><p>Enter your name, get a card and claim when you complete the round's pattern.</p></div><section class="panel"><div class="row"><input id="playerName" maxlength="32" placeholder="Enter your player name"><button id="newCard">Get my card</button></div><div class="round" id="round">Connecting to the game…</div><div class="number" id="lastNumber">Waiting for the first number</div><div class="grid" id="card"></div><div class="status" id="status">Enter your name to join the game.</div><div class="row"><button class="claim" id="claim" disabled>CLAIM</button></div><div class="winner" id="winner"></div><div class="called" id="called">Called numbers will appear here.</div></section></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),$=id=>document.getElementById(id);let card=[],called=[],marked=new Set(["FREE"]),joined=false,round=1,winner="",lastRound=0;
const roundName=()=>round===2?"ONE ROW":round===3?"FULL HOUSE — FINAL ROUND":"FULL HOUSE — ROUND 1";
function makeCard(){const cols=[[1,15],[16,30],[31,45],[46,60],[61,75]];card=cols.map(([a,b])=>{let arr=[];while(arr.length<5){let n=a+Math.floor(Math.random()*(b-a+1));if(!arr.includes(n))arr.push(n)}return arr});card[2][2]="FREE";marked=new Set(["FREE"]);called.forEach(n=>{if(card.some(col=>col.includes(n)))marked.add(String(n))});draw()}
function hasPattern(){if(!card.length)return false;if(round===2){for(let r=0;r<5;r++)if(card.every(col=>marked.has(String(col[r]))||col[r]==="FREE"))return true;return false}return card.every(col=>col.every(n=>n==="FREE"||marked.has(String(n))))}
function draw(){const el=$("card");el.innerHTML="";for(let r=0;r<5;r++)for(let c=0;c<5;c++){let n=card[c]?.[r],b=document.createElement("button");b.className="cell"+(n==="FREE"?" free":"")+(marked.has(String(n))?" mark":"");b.textContent=n;b.disabled=true;el.append(b)}$("claim").disabled=!joined||!hasPattern()||!!winner; if(hasPattern()&&!winner)$("status").textContent="Winning pattern complete! Press CLAIM."; }
function update(s){if(!s)return;called=Array.isArray(s.bingoCalled)?s.bingoCalled:called;round=Number(s.bingoRound)||1;winner=s.bingoWinner||"";if(joined&&lastRound&&round!==lastRound){makeCard();$("status").textContent="New card generated for the next round."}lastRound=round;called.forEach(n=>{if(card.some(col=>col.includes(n)))marked.add(String(n))});$("round").textContent="CURRENT ROUND: "+roundName();$("lastNumber").textContent=s.bingoNumber?"Latest number: "+s.bingoNumber:"Waiting for the first number";$("called").innerHTML=called.length?"Called: <strong>"+called.join(", ")+"</strong>":"No numbers called yet";if(winner){$("winner").textContent=winner+" has claimed "+(s.bingoWinnerType||"BINGO")+"!";$("winner").classList.add("show")}else $("winner").classList.remove("show");draw()}
$("newCard").onclick=()=>{let name=$("playerName").value.trim();if(!name){$("status").textContent="Please enter your name first.";return}joined=true;makeCard();socket.emit("identify","player");$("status").textContent="Card ready for "+name+".";};
socket.on("connect",()=>{if(joined)socket.emit("identify","player")});socket.on("bingo-state",update);socket.on("display-settings",update);socket.on("bingo-winner",d=>{winner=d.name||"A player";$("winner").textContent=winner+" has claimed "+(d.type||"BINGO")+"!";$("winner").classList.add("show");draw()});socket.on("bingo-claim-rejected",d=>$("status").textContent=d.message||"Claim not accepted.");
$("claim").onclick=()=>{if(!joined||!hasPattern())return;socket.emit("bingo-claim",{name:$("playerName").value.trim(),card,marked:Array.from(marked)})};
</script></body></html>
