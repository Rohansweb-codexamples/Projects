<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohans Web Bingo Card</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#53227b,#160d27 65%);color:#fff;font-family:Arial,sans-serif;min-height:100vh;padding:22px}.wrap{max-width:760px;margin:auto}.top{text-align:center}.top small{color:#ffc15b;letter-spacing:3px;font-weight:bold}.top h1{font-size:clamp(32px,6vw,54px);margin:8px 0}.panel{background:#241338;border:1px solid #ffffff25;border-radius:20px;padding:18px;box-shadow:0 20px 60px #0006}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0}.row input{min-width:180px}.row input,.row button{border:1px solid #ffffff35;border-radius:10px;padding:12px;background:#170d25;color:white;font-size:15px}.row button{background:linear-gradient(110deg,#ff7b1a,#ffd15b);color:#21102d;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.head,.cell{display:grid;place-items:center;border-radius:10px;min-height:58px;font-weight:900}.head{background:#ff922e;color:#24102e;font-size:clamp(18px,4vw,28px)}.cell{background:#38204f;border:1px solid #ffffff20;font-size:clamp(18px,4vw,28px);cursor:pointer;user-select:none}.cell.mark{background:#ffb638;color:#21102d;box-shadow:0 0 18px #ffb63888}.cell.free{background:#673a85;color:#fff;font-size:13px}.status{text-align:center;color:#ffe2a0;min-height:26px;margin:14px 0;font-weight:bold}.call{text-align:center;font-size:13px;color:#d7c5e9}.call strong{color:#ffcb68}.footer{text-align:center;color:#bba7d0;font-size:12px;margin-top:14px}@media(max-width:480px){body{padding:12px}.panel{padding:10px}.grid{gap:4px}.head,.cell{min-height:52px;border-radius:7px}}
</style></head><body><div class="wrap"><div class="top"><small>ROHANS WEB • LIVE GAME</small><h1>Virtual Bingo</h1><p>Join the game, mark your numbers and shout BINGO!</p></div><section class="panel"><div class="row"><input id="playerName" maxlength="32" placeholder="Enter your name"><button id="newCard">Get my card</button></div><div class="grid" id="card"></div><div class="status" id="status">Enter your name and get a card to join.</div><div class="row"><button id="claim" disabled>CALL BINGO!</button></div><div class="call" id="called">Waiting for the bingo caller…</div><div class="footer">Numbers called by the host are marked automatically. You can also tap a called number to mark or unmark it.</div></section></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),$=id=>document.getElementById(id);let card=[],called=[],marked=new Set(),joined=false;
function makeCard(){const cols=[[1,15],[16,30],[31,45],[46,60],[61,75]];card=cols.map(([a,b])=>{let arr=[];while(arr.length<5){let n=a+Math.floor(Math.random()*(b-a+1));if(!arr.includes(n))arr.push(n)}return arr});card[2][2]="FREE";marked=new Set(["FREE"]);draw()}
function draw(){const el=$("card");el.innerHTML="";["B","I","N","G","O"].forEach(x=>{let h=document.createElement("div");h.className="head";h.textContent=x;el.append(h)});for(let r=0;r<5;r++)for(let c=0;c<5;c++){let n=card[c]?.[r],b=document.createElement("button");b.className="cell"+(n==="FREE"?" free":"")+(marked.has(n)?" mark":"");b.textContent=n;b.onclick=()=>{if(n==="FREE")return;if(!called.includes(n)){ $("status").textContent="That number has not been called yet.";return}marked.has(n)?marked.delete(n):marked.add(n);draw();check()};el.append(b)}check()}
function check(){const lines=[];for(let r=0;r<5;r++)lines.push(Array.from({length:5},(_,c)=>card[c][r]));for(let c=0;c<5;c++)lines.push(card[c]);lines.push(Array.from({length:5},(_,i)=>card[i][i]),Array.from({length:5},(_,i)=>card[i][4-i]));const win=lines.some(line=>line.every(n=>marked.has(n)));$("claim").disabled=!win||!joined;if(win)$("status").textContent="You have a bingo line! Press CALL BINGO!";return win}
function sync(s){if(!s)return;called=s.bingoCalled||[];called.forEach(n=>{if(card.some(col=>col.includes(n)))marked.add(n)});$("called").innerHTML=called.length?"Numbers called: <strong>"+called.join(", ")+"</strong>":"Waiting for the bingo caller…";draw()}
$("newCard").onclick=()=>{if(!$("playerName").value.trim()){$("status").textContent="Please enter your name first.";return}makeCard();joined=true;socket.emit("identify","player");$("status").textContent="Your card is ready, "+$("playerName").value.trim()+"!";};
socket.on("connect",()=>{if(joined)socket.emit("identify","player")});socket.on("bingo-state",sync);socket.on("display-settings",sync);socket.on("bingo-winner",d=>{$("status").textContent=(d.name||"Someone")+" called BINGO!";});
$("claim").onclick=()=>{if(check())socket.emit("bingo-claim",{name:$("playerName").value.trim()})};
</script></body></html>
