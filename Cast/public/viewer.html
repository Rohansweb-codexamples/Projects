<style>
*{

}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial,sans-serif;
}

body{
    cursor:none;
}

/* MOVING BACKGROUND */
#bg{
    position:fixed;
    inset:-30%;
    background:
        radial-gradient(
            circle at 50% 50%,
            #fff3a3 0%,
            #ffd43b 15%,
            #ff9800 38%,
            #ff4d00 62%,
            #080808 100%
        );
    filter:blur(65px);
    transform:scale(1);
    will-change:transform;
}

/* EXTRA MOVING LIGHT */
#light{
    position:fixed;
    width:45vw;
    height:45vw;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.25),
            rgba(255,170,0,.12),
            transparent 70%
        );
    filter:blur(30px);
    pointer-events:none;
}

/* VISUALISER */
#canvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

/* IMAGE */
#picture{
    position:absolute;
    top:50%;
    left:50%;

    max-width:88%;
    max-height:88%;

    object-fit:contain;

    border-radius:24px;

    box-shadow:
        0 0 35px rgba(255,255,255,.18),
        0 0 90px rgba(255,140,0,.35);

    opacity:0;

    transition:
        opacity .5s ease,
        filter .15s linear;

    will-change:
        transform,
        filter;
}

/* STATUS */
#status{
    position:absolute;
    top:20px;
    left:20px;

    padding:11px 17px;

    color:white;

    background:rgba(0,0,0,.45);

    border:1px solid rgba(255,255,255,.12);

    border-radius:14px;

    backdrop-filter:blur(12px);

    font-size:14px;

    z-index:10;
}

/* CLOCK */
#clock{
    position:absolute;
    top:20px;
    right:20px;

    padding:10px 16px;

    color:white;

    background:rgba(0,0,0,.45);

    border-radius:14px;

    backdrop-filter:blur(12px);

    font-size:24px;

    z-index:10;
}

/* CONNECTION DOT */
#dot{
    display:inline-block;

    width:9px;
    height:9px;

    margin-right:7px;

    border-radius:50%;

    background:#ff3b30;
}

/* HINT */
#hint{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    color:white;

    background:rgba(0,0,0,.42);

    padding:11px 18px;

    border-radius:14px;

    backdrop-filter:blur(12px);

    font-size:14px;

    z-index:10;

    opacity:.8;

    transition:
        opacity .5s ease;
}

/* HIDE UI AFTER START */
body.started #hint{
    opacity:0;
}

body.started #status{
    opacity:.35;
}
</style>
