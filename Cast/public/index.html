<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rohans Web TV Controller</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd54f,#ff9800,#ff5722);min-height:100vh;padding:18px;color:#111}
.panel{max-width:1150px;margin:auto;background:#fff;border-radius:26px;padding:22px;box-shadow:0 20px 55px rgba(0,0,0,.25)}
h1{margin:0 0 8px}
.sub{margin:0 0 18px;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
button{border:0;padding:14px;border-radius:14px;cursor:pointer;font-weight:700;background:#111;color:#fff;transition:.15s}
button:hover{transform:translateY(-2px)}
button.active{background:linear-gradient(135deg,#ff9800,#ff5722)}
input[type=file]{width:100%;padding:12px;border:2px dashed #ff9800;border-radius:14px;margin:12px 0}
.layout{display:grid;grid-template-columns:1fr 310px;gap:18px;margin-top:18px}
@media(max-width:900px){.layout{grid-template-columns:1fr}}
.preview{height:540px;background:#03030a;border-radius:22px;position:relative;overflow:hidden}
#bgCanvas,#waveCanvas{position:absolute;inset:0;width:100%;height:100%}
#picture{position:absolute;top:50%;left:50%;max-width:86%;max-height:82%;object-fit:contain;border-radius:18px;transform:translate(-50%,-50%);box-shadow:0 0 40px rgba(255,255,255,.3)}
.side{background:#f5f5f5;border-radius:20px;padding:16px}
.stat{padding:11px;background:#e8e8e8;border-radius:11px;margin:8px 0}
label{display:block;font-weight:700;margin:16px 0 7px}
input[type=range]{width:100%}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.small{font-size:12px;opacity:.65}
</style>
</head>
<body>
<div class="panel">
<h1>Rohans Web TV Controller</h1>
<p class="sub">Control the TV display, picture, audio visualizer and animated background from this tablet.</p>

<div class="grid">
<button id="startMic">Start Audio</button>
<button id="sendImage">Send Picture</button>
<button id="fullscreenBtn">Fullscreen Preview</button>
<button id="resetBtn">Reset TV</button>
</div>

<input id="imageInput" type="file" accept="image/*">

<div class="layout">
<div class="preview">
<canvas id="bgCanvas"></canvas>
<canvas id="waveCanvas"></canvas>
<img id="picture" alt="">
</div>

<div class="side">
<h3>Connection</h3>
<div class="stat" id="connectionStatus">Connecting...</div>
<div class="stat" id="tvStatus">Waiting for TV...</div>
<div class="stat" id="audioStatus">Audio Stopped</div>

<label>TV Animation</label>
<div class="modeGrid" id="modeButtons"></div>
<button id="autoBtn" style="width:100%;margin-top:10px">Auto Cycle: ON</button>

<label>Image Scale</label>
<input id="imageScale" type="range" min=".2" max="3" step=".05" value="1">

<label>Background Strength</label>
<input id="strength" type="range" min="0" max="5" step=".1" value="1">

<label>Wave Height</label>
<input id="waveHeight" type="range" min="0" max="8" step=".1" value="2">
<p class="small">Animation buttons change the TV immediately.</p>
</div>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const modes=["Galaxy Space","Fireworks","Neon Tunnel","Sun","Starfield","Aurora","Cosmic Waves","Meteor Travel","Plasma","Hyperspace"];
const socket=io({transports:["websocket","polling"],reconnection:true,reconnectionAttempts:Infinity,reconnectionDelay:1000,timeout:10000});
const statusEl=document.getElementById("connectionStatus");
const tvEl=document.getElementById("tvStatus");
const picture=document.getElementById("picture");
const imageInput=document.getElementById("imageInput");
const bgCanvas=document.getElementById("bgCanvas");
const waveCanvas=document.getElementById("waveCanvas");
const bg=bgCanvas.getContext("2d"), ctx=waveCanvas.getContext("2d");
let analyser=null,dataArray=null,auto=true,audioLevel=0;

socket.on("connect",()=>{socket.emit("identify","controller");statusEl.textContent="Connected to TV Server";});
socket.on("disconnect",()=>{statusEl.textContent="Disconnected - reconnecting...";tvEl.textContent="TV connection unavailable";});
socket.on("connect_error",e=>{statusEl.textContent="Connection error: "+(e.message||"Server unavailable");});
socket.on("connection-status",d=>{tvEl.textContent=(d.viewers>0?"TV connected":"No TV viewer open")+" | Controllers: "+d.controllers;});

function resize(){bgCanvas.width=bgCanvas.clientWidth;bgCanvas.height=bgCanvas.clientHeight;waveCanvas.width=waveCanvas.clientWidth;waveCanvas.height=waveCanvas.clientHeight}
addEventListener("resize",resize);resize();

const modeButtons=document.getElementById("modeButtons");
modes.forEach((name,i)=>{
 const b=document.createElement("button"); b.textContent=name; b.dataset.mode=i;
 b.onclick=()=>{socket.emit("animation-mode",{mode:i});setActive(i);};
 modeButtons.appendChild(b);
});
function setActive(i){document.querySelectorAll("[data-mode]").forEach(b=>b.classList.toggle("active",Number(b.dataset.mode)===i))}
setActive(0);

document.getElementById("autoBtn").onclick=()=>{
 auto=!auto; socket.emit("animation-auto",{enabled:auto});
 document.getElementById("autoBtn").textContent="Auto Cycle: "+(auto?"ON":"OFF");
};

imageInput.onchange=e=>{
 const file=e.target.files[0]; if(!file)return;
 const reader=new FileReader();
 reader.onload=()=>{picture.src=reader.result;socket.emit("controller-image",{image:reader.result})};
 reader.readAsDataURL(file);
};
document.getElementById("sendImage").onclick=()=>{if(picture.src)socket.emit("controller-image",{image:picture.src})};

document.getElementById("resetBtn").onclick=()=>socket.emit("reset-display");

document.getElementById("imageScale").oninput=e=>{
 picture.style.transform=`translate(-50%,-50%) scale(${e.target.value})`;
 socket.emit("image-scale",{scale:Number(e.target.value)});
};

document.getElementById("fullscreenBtn").onclick=()=>{
 document.querySelector(".preview").requestFullscreen?.();
};

document.getElementById("startMic").onclick=async()=>{
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const ac=new (window.AudioContext||window.webkitAudioContext)();
  const source=ac.createMediaStreamSource(stream);
  analyser=ac.createAnalyser(); analyser.fftSize=256; source.connect(analyser);
  dataArray=new Uint8Array(analyser.frequencyBinCount);
  document.getElementById("audioStatus").textContent="Audio Running";
  animateAudio();
 }catch(e){document.getElementById("audioStatus").textContent="Microphone blocked: "+e.message}
};

function animateAudio(){
 requestAnimationFrame(animateAudio); if(!analyser)return;
 analyser.getByteFrequencyData(dataArray);
 let total=0; for(const n of dataArray)total+=n;
 audioLevel=total/dataArray.length;
 socket.emit("audio-level",{level:audioLevel});
 drawWave();
 const strength=Number(document.getElementById("strength").value);
 document.querySelector(".preview").style.boxShadow="0 0 "+(20+audioLevel*strength/3)+"px rgba(255,140,0,.65)";
}
function drawWave(){
 const w=waveCanvas.width,h=waveCanvas.height;ctx.clearRect(0,0,w,h);
 const wh=Number(document.getElementById("waveHeight").value);
 ctx.beginPath();
 for(let x=0;x<w;x+=5){const y=h*.85+Math.sin(x*.02+Date.now()*.005)*(audioLevel/10)*wh;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
 ctx.strokeStyle="#ffd54f";ctx.lineWidth=3;ctx.stroke();
}
</script>
</body>
</html>
