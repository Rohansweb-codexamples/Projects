<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo TV Viewer</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#552477,#160b29 70%);font-family:Arial,sans-serif;color:white;display:grid;place-items:center;text-align:center}.wrap{width:100%;padding:3vw}.brand{color:#ffc45b;font-weight:bold;letter-spacing:6px;font-size:clamp(14px,2vw,24px)}h1{font-size:clamp(48px,9vw,110px);margin:10px 0;color:#ff9a2e;text-shadow:0 0 35px #ff6b1c}.number{font-size:clamp(130px,32vw,360px);font-weight:1000;line-height:1;color:#fff0bd;text-shadow:0 0 35px #ff9c34,0 0 90px #ff4fba}.letter{font-size:clamp(28px,5vw,60px);font-weight:bold;color:#dcb8ff}.called{margin:25px auto 0;max-width:1000px;color:#d8c5eb;font-size:clamp(14px,2vw,22px);line-height:1.7}.winner{display:none;position:fixed;inset:0;background:radial-gradient(circle,#7a2999,#1b092e 75%);place-items:center;z-index:5}.winner.show{display:grid}.winner strong{font-size:clamp(60px,13vw,160px);color:#ffcf61;text-shadow:0 0 50px #ff741a}.winner span{display:block;font-size:clamp(28px,5vw,60px);margin-top:20px}
</style></head><body><main class="wrap"><div class="brand">ROHANS WEB • LIVE BINGO</div><h1>BINGO</h1><div class="number" id="number">—</div><div class="letter" id="letter">Waiting for the caller</div><div class="called" id="called">The numbers will appear here as they are called.</div></main><div class="winner" id="winner"><div><strong>BINGO!</strong><span id="winnerName"></span></div></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),$=id=>document.getElementById(id);function update(s){if(!s)return;let n=Number(s.bingoNumber||0);$("number").textContent=n||"—";$("letter").textContent=n?((n<=15?"B":n<=30?"I":n<=45?"N":n<=60?"G":"O")+" • "+n):"Waiting for the caller";$("called").textContent=(s.bingoCalled||[]).map(x=>(x<=15?"B":x<=30?"I":x<=45?"N":x<=60?"G":"O")+" "+x).join("   •   ");if(s.bingoWinner){$("winnerName").textContent=s.bingoWinner+" is the winner!";$("winner").classList.add("show")}else $("winner").classList.remove("show")}
socket.on("connect",()=>socket.emit("identify","viewer"));socket.on("initial-state",update);socket.on("display-settings",update);socket.on("bingo-winner",d=>{$("winnerName").textContent=(d.name||"A player")+" is the winner!";$("winner").classList.add("show")});
</script></body></html>
