<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#180c2a,#452064);font-family:Arial,sans-serif;color:#fff;padding:20px}.wrap{max-width:1050px;margin:auto}header{text-align:center}header small{color:#ffc45c;letter-spacing:3px;font-weight:bold}h1{font-size:clamp(34px,6vw,50px);margin:8px}.panel{background:#241338;border:1px solid #ffffff25;border-radius:18px;padding:20px;margin:16px 0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{border:0;border-radius:10px;padding:13px 18px;font-weight:bold;cursor:pointer;background:linear-gradient(110deg,#ff7b1a,#ffd15b);color:#21102d}.controls button.alt{background:#ffffff18;color:white;border:1px solid #ffffff35}.ball{font-size:clamp(90px,18vw,160px);font-weight:1000;color:#ffcb61;text-align:center;text-shadow:0 0 30px #ff8b2e}.label{text-align:center;color:#d8c7e8}.history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{background:#45275e;border:1px solid #ffffff25;padding:9px 12px;border-radius:9px;font-weight:bold}.notice{text-align:center;font-size:22px;font-weight:bold;color:#ffcf69;min-height:32px}.input{background:#160d24;border:1px solid #ffffff35;border-radius:10px;color:white;padding:12px}.stage{text-align:center;font-size:21px;font-weight:900;color:#ffd16a;margin:12px}.hint{text-align:center;color:#d9c9e8;font-size:13px}
</style></head><body><div class="wrap"><header><small>ROHANS WEB • HOST CONSOLE</small><h1>Bingo Admin</h1><p>Call numbers, manage the rounds and announce claims to the TV.</p></header><section class="panel"><div class="label">CURRENT NUMBER</div><div class="ball" id="number">—</div><div class="label" id="letter">Ready to start</div><div class="stage" id="stage">Round 1: Full House</div><div class="controls"><button id="start">START GAME</button><button id="next">CALL NEXT NUMBER</button><button class="alt" id="repeat">Repeat number</button><button class="alt" id="nextRound">NEXT ROUND</button><button class="alt" id="reset">RESET GAME</button><button class="alt" id="show">Open Bingo Viewer</button></div><p class="hint">Round order: Full House → One Row → Full House (Final).</p></section><section class="panel"><div class="notice" id="winner">No winner yet</div><div class="controls"><input class="input" id="winnerName" placeholder="Winner name"><button id="announce">MANUAL ANNOUNCEMENT</button><button class="alt" id="clearWinner">Clear winner</button></div></section><section class="panel"><h2 style="text-align:center">Numbers called</h2><div class="history" id="history"></div><p class="label" id="count">0 of 75 numbers called</p></section></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),$=id=>document.getElementById(id);let called=[],last=0,winner="",round=1;
const stage=()=>round===2?"Round 2: One Row":round===3?"Round 3: Full House (Final)":"Round 1: Full House";
function publish(){socket.emit("display-settings",{bingoActive:true,bingoNumber:last,bingoCalled:called,bingoWinner:winner,bingoWinnerType:"",bingoRound:round,bingoLastCall:Date.now()});render()}
function render(){$("number").textContent=last||"—";$("letter").textContent=last?(last<=15?"B":last<=30?"I":last<=45?"N":last<=60?"G":"O")+" • "+last:"Ready to start";$("stage").textContent=stage();$("winner").textContent=winner?winner+" — BINGO!":"No winner yet";$("history").innerHTML="";called.forEach(n=>{let d=document.createElement("span");d.className="chip";d.textContent=(n<=15?"B":n<=30?"I":n<=45?"N":n<=60?"G":"O")+" "+n;$("history").append(d)});$("count").textContent=called.length+" of 75 numbers called"}
function reset(){called=[];last=0;winner="";round=1;publish()}
$("start").onclick=()=>reset();
$("next").onclick=()=>{if(called.length===75)return;let n;do{n=1+Math.floor(Math.random()*75)}while(called.includes(n));called.push(n);last=n;publish()};
$("repeat").onclick=()=>{if(last)render()};
$("nextRound").onclick=()=>{if(round<3){round++;winner="";publish()}else{$("winner").textContent="Final round complete. Reset to play again."}};
$("reset").onclick=reset;
$("announce").onclick=()=>{winner=$("winnerName").value.trim()||"A player";socket.emit("display-settings",{bingoWinner:winner,bingoWinnerType:"BINGO",bingoRound:round,bingoActive:true});socket.emit("bingo-admin-winner",{name:winner,type:"BINGO"});render()};
$("clearWinner").onclick=()=>{winner="";publish()};
$("show").onclick=()=>window.open("/bingo-viewer.html","_blank");
socket.on("connect",()=>socket.emit("identify","controller"));socket.on("bingo-state",s=>{if(s?.bingoCalled){called=s.bingoCalled;last=s.bingoNumber||0;winner=s.bingoWinner||"";round=Number(s.bingoRound)||1;render()}});socket.on("bingo-winner",d=>{winner=d.name||"A player";render()});render();
</script></body></html>
