<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bingo Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#180c2a,#452064);font-family:Arial,sans-serif;color:#fff;padding:22px}.wrap{max-width:1050px;margin:auto}header{text-align:center}header small{color:#ffc45c;letter-spacing:3px;font-weight:bold}h1{font-size:48px;margin:8px}.panel{background:#241338;border:1px solid #ffffff25;border-radius:18px;padding:20px;margin:16px 0}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls button{border:0;border-radius:10px;padding:13px 20px;font-weight:bold;cursor:pointer;background:linear-gradient(110deg,#ff7b1a,#ffd15b);color:#21102d}.controls button.alt{background:#ffffff18;color:white;border:1px solid #ffffff35}.ball{font-size:clamp(80px,16vw,150px);font-weight:1000;color:#ffcb61;text-align:center;text-shadow:0 0 30px #ff8b2e}.label{text-align:center;color:#d8c7e8}.history{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.chip{background:#45275e;border:1px solid #ffffff25;padding:9px 12px;border-radius:9px;font-weight:bold}.notice{text-align:center;font-size:22px;font-weight:bold;color:#ffcf69;min-height:32px}.input{background:#160d24;border:1px solid #ffffff35;border-radius:10px;color:white;padding:12px}.row{text-align:center;margin:12px}
</style></head><body><div class="wrap"><header><small>ROHANS WEB • HOST CONSOLE</small><h1>Bingo Admin</h1><p>Call numbers and control the live TV display.</p></header><section class="panel"><div class="label">CURRENT NUMBER</div><div class="ball" id="number">—</div><div class="label" id="letter">Ready to start</div><div class="controls"><button id="next">CALL NEXT NUMBER</button><button class="alt" id="repeat">Repeat number</button><button class="alt" id="reset">New game / Reset</button><button class="alt" id="show">Show Bingo viewer</button></div></section><section class="panel"><div class="notice" id="winner">No winner yet</div><div class="controls"><input class="input" id="winnerName" placeholder="Winner name"><button id="announce">Announce BINGO!</button><button class="alt" id="clearWinner">Clear winner</button></div></section><section class="panel"><h2 style="text-align:center">Numbers called</h2><div class="history" id="history"></div><p class="label" id="count">0 of 75 numbers called</p></section></div><script src="/socket.io/socket.io.js"></script><script>
const socket=io({transports:["websocket","polling"]}),$=id=>document.getElementById(id);let called=[],last=0,winner="";
function publish(){socket.emit("display-settings",{bingoActive:true,bingoNumber:last,bingoCalled:called,bingoWinner:winner,bingoLastCall:Date.now()});render()}
function render(){ $("number").textContent=last||"—";$("letter").textContent=last?("BINGO • "+(last<=15?"B":last<=30?"I":last<=45?"N":last<=60?"G":"O")):"Ready to start";$("winner").textContent=winner?winner+" — BINGO!":"No winner yet";$("history").innerHTML="";called.forEach(n=>{let d=document.createElement("span");d.className="chip";d.textContent=(n<=15?"B":n<=30?"I":n<=45?"N":n<=60?"G":"O")+" "+n;$("history").append(d)});$("count").textContent=called.length+" of 75 numbers called"}
function reset(){called=[];last=0;winner="";publish()}
$("next").onclick=()=>{if(called.length===75)return;let n;do{n=1+Math.floor(Math.random()*75)}while(called.includes(n));called.push(n);last=n;winner="";publish()};
$("repeat").onclick=()=>{if(last)render()};
$("reset").onclick=reset;
$("announce").onclick=()=>{winner=$("winnerName").value.trim()||"A player";publish();socket.emit("bingo-claim",{name:winner})};
$("clearWinner").onclick=()=>{winner="";publish()};
$("show").onclick=()=>{socket.emit("display-settings",{bingoActive:true,bingoCalled:called,bingoNumber:last,bingoWinner:winner})};
socket.on("connect",()=>{socket.emit("identify","controller")});socket.on("bingo-winner",d=>{winner=d.name||"A player";render()});socket.on("bingo-state",s=>{if(s?.bingoCalled){called=s.bingoCalled;last=s.bingoNumber||0;winner=s.bingoWinner||"";render()}});
render();
</script></body></html>
