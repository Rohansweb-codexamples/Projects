<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rohans Web TV Admin</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>"><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Arial;background:linear-gradient(135deg,#111,#352f75,#111);color:#fff}main{height:100vh;padding:12px;display:grid;grid-template-rows:auto 1fr;gap:10px}.head,.card{background:#ffffff12;border:1px solid #fff2;border-radius:18px;backdrop-filter:blur(16px)}.head{padding:14px;display:flex;justify-content:space-between;align-items:center}.title{font-size:22px;font-weight:900}.sub{font-size:11px;opacity:.6}.grid{min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:10px}.card{padding:14px;overflow:hidden}.card h2{font-size:14px;margin:0 0 10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat,.device,.log{background:#0004;border-radius:11px;padding:10px}.stat b{display:block;font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}button{border:0;border-radius:11px;padding:11px;background:linear-gradient(135deg,#ff9800,#ff1744);color:#fff;font-weight:900;cursor:pointer}.neutral{background:#ffffff18}.danger{background:#d50000}.log{height:calc(100% - 25px);font:11px monospace;white-space:pre-wrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#00e676;margin-right:5px}</style></head><body><main><header class="head"><div><div class="title">Rohans Web TV Admin Centre</div><div class="sub">Devices, connections, diagnostics and administration</div></div><button onclick="location.href='/'">Back to Controller</button></header><section class="grid"><div class="card"><h2>System Status</h2><div class="stats"><div class="stat">Server<b id="server">Online</b></div><div class="stat">TV Viewers<b id="viewers">0</b></div><div class="stat">Controllers<b id="controllers">0</b></div><div class="stat">Socket<b id="socket">Offline</b></div></div></div><div class="card"><h2>Administration</h2><div class="actions"><button class="danger" id="reset">Emergency Reset</button><button id="full">TV Fullscreen</button><button class="neutral" onclick="location.href='/viewer'">Open TV</button><button class="neutral" onclick="location.reload()">Refresh</button></div></div><div class="card"><h2>Connected Devices</h2><div id="devices" class="device"><span class="dot"></span>Waiting...</div></div><div class="card"><h2>Quick Themes</h2><div class="actions" id="themes"></div></div><div class="card"><h2>Diagnostics</h2><div id="log" class="log">Rohans Web TV Admin started...\n</div></div><div class="card"><h2>Navigation</h2><div class="actions"><button onclick="location.href='/'">Controller</button><button onclick="location.href='/viewer'">TV Display</button></div></div></section></main><script src="/socket.io/socket.io.js"></script><script>const s=io({transports:["websocket","polling"]}),log=document.getElementById("log");function add(x){log.textContent+=new Date().toLocaleTimeString()+" "+x+"\n"}s.on("connect",()=>{socket.textContent="Connected";add("Socket connected");s.emit("identify","controller")});s.on("disconnect",()=>{socket.textContent="Offline";add("Socket disconnected")});s.on("connection-status",d=>{viewers.textContent=d.viewers;controllers.textContent=d.controllers;devices.innerHTML='<span class="dot"></span>'+d.viewers+' TV viewer(s)<br><span class="dot"></span>'+d.controllers+' controller(s)'});reset.onclick=()=>{s.emit("reset-display");add("Reset sent")};full.onclick=()=>{s.emit("display-settings",{fullscreen:true});add("Fullscreen sent")};[["Sunset","#ff6b35"],["Ocean","#008cff"],["Neon","#d946ef"],["Forest","#16a34a"],["Galaxy","#651fff"],["Rainbow","#ff00aa"]].forEach(x=>{let b=document.createElement("button");b.textContent=x[0];b.style.background=x[1];b.onclick=()=>{s.emit("display-settings",{color:x[1],lights:true});add(x[0]+" theme sent")};themes.appendChild(b)})</script></body></html>
